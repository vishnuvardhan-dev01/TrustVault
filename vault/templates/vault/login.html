<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TrustVault</title>
</head>
<body>
    <h1>Log in to TrustVault</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>New user? <a href="{% url 'signup' %}">Create an account</a></p>
</body>
</html>
